<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Rentals</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <!-- Anti-flash: aplica el tema guardado ANTES del primer paint (evita el destello claro). -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('toprentals-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: hsl(var(--background)); color: hsl(var(--foreground)); }
    /* Scrollbar fino */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
  </style>
</head>
<body class="bg-background text-foreground antialiased overflow-hidden selection:bg-stone-200 selection:text-stone-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
